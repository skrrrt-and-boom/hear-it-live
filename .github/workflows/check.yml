name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/concert-finder/scripts/report.py examples/krakow-bach.json --check
      - run: python skills/concert-finder/scripts/playlist.py examples/playlist-demo.json --require-complete
      - run: python skills/concert-finder/scripts/report.py examples/playlist-concerts.json --check
      - run: python tools/package.py
